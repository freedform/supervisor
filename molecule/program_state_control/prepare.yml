---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Deploy HUP trapping script
      ansible.builtin.copy:
        dest: /usr/local/bin/hup_trap.sh
        mode: '0755'
        content: |
          #!/bin/bash
          trap 'echo HUP >> /tmp/hup_trap.log' HUP
          while true; do sleep 1; done

    - name: Install Supervisor with programs
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        supervisor_actions: install,deploy_config,deploy_programs,state_control,program_state_control
        supervisor_state_action: started
        supervisor_program_state: updated
        supervisor_config:
          unix_http_server:
            file: /var/run/supervisor.sock
            chmod: "0700"
          supervisord:
            logfile: /var/log/supervisor/supervisord.log
            pidfile: /var/run/supervisord.pid
            childlogdir: /var/log/supervisor
          rpcinterface:supervisor:
            supervisor.rpcinterface_factory: supervisor.rpcinterface:make_main_rpcinterface
          supervisorctl:
            serverurl: unix:///var/run/supervisor.sock
          include:
            files: /etc/supervisor/conf.d/*.conf
        supervisor_programs:
          single:
            command: /bin/sleep infinity
          multi:
            command: /bin/sleep infinity
            numprocs: 2
            process_name: "%(program_name)s_%(process_num)02d"
          hup:
            command: /usr/local/bin/hup_trap.sh
