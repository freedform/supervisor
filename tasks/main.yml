---
- name: Create supervisor_action_list
  ansible.builtin.set_fact:
    supervisor_action_list: "{{ (supervisor_actions | default('')).split(',') | reject('equalto', '') | list }}"

- name: Validate supervisor_action_list
  ansible.builtin.assert:
    that:
      - supervisor_action_list | length > 0
      - supervisor_action_list | difference(supervisor_supported_actions) | length == 0
    fail_msg: "supervisor_actions must be set to one or more of: {{ supervisor_supported_actions | join(', ') }}"

- name: Deploy supervisor
  ansible.builtin.include_tasks: "{{ task_name }}.yml"
  loop: "{{ supervisor_action_list }}"
  loop_control:
    loop_var: task_name
